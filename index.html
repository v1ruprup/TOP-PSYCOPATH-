<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Psychopath</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.container {
    width: 320px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(255,0,0,0.2);
}

/* Title */
h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #ff2e2e;
    text-shadow: 0 0 10px #ff0000;
}

/* List */
ul {
    list-style: none;
    padding: 0;
}

/* Item */
li {
    background: rgba(255,255,255,0.08);
    margin: 10px 0;
    padding: 15px;
    border-radius: 12px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.3s;
}

li:hover {
    transform: scale(1.03);
    background: rgba(255,255,255,0.15);
}

.rank {
    font-weight: bold;
    color: #ff4444;
}

.name {
    flex: 1;
    text-align: center;
}

/* Dragging style */
.dragging {
    opacity: 0.5;
    transform: scale(1.05);
}

/* Glow top 1 */
li:first-child {
    background: linear-gradient(90deg, gold, orange);
    color: black;
    font-weight: bold;
    box-shadow: 0 0 15px gold;
}

.hint {
    text-align: center;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 15px;
    opacity: 0.8;
    animation: fade 2s infinite alternate;
}

@keyframes fade {
    from { opacity: 0.4; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Top Psychopath</h1>
    <p class="hint">Tahan dan geser untuk memindahkan</p>
    <ul id="leaderboard">
        <li draggable="true"><span class="rank">1.</span><span class="name">Irsyad</span></li>
        <li draggable="true"><span class="rank">2.</span><span class="name">Hilmi</span></li>
        <li draggable="true"><span class="rank">3.</span><span class="name">Ibnu</span></li>
        <li draggable="true"><span class="rank">4.</span><span class="name">Tsany</span></li>
        <li draggable="true"><span class="rank">5.</span><span class="name">Fazli</span></li>
    </ul>
</div>

<script>
const list = document.getElementById("leaderboard");
let draggedItem = null;

list.querySelectorAll("li").forEach(item => {
    item.addEventListener("dragstart", () => {
        draggedItem = item;
        item.classList.add("dragging");
    });

    item.addEventListener("dragend", () => {
        item.classList.remove("dragging");
        updateRanks();
    });

    item.addEventListener("dragover", e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(list, e.clientY);
        if (afterElement == null) {
            list.appendChild(draggedItem);
        } else {
            list.insertBefore(draggedItem, afterElement);
        }
    });
});

function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll("li:not(.dragging)")];

    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;

        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function updateRanks() {
    const items = list.querySelectorAll("li");
    items.forEach((item, index) => {
        item.querySelector(".rank").textContent = (index + 1) + ".";
    });
}
</script>

</body>
  </html>
